<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROK VPN — Admin</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0d1117; }
    .card { border: 1px solid #30363d; background: #161b22; }
    .brand { font-weight: 700; letter-spacing: .05em; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div style="width:100%;max-width:380px" class="px-3">

    <div class="text-center mb-4">
      <h4 class="brand text-light">ROK <span class="text-primary">VPN</span></h4>
      <p class="text-secondary small mb-0">Admin panel</p>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }} alert-dismissible py-2" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <div class="card p-4 shadow-sm">
      <form method="post" action="/login" autocomplete="off">
        <div class="mb-3">
          <label for="password" class="form-label text-secondary small">Password</label>
          <input type="password" id="password" name="password"
                 class="form-control form-control-lg"
                 placeholder="••••••••" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
